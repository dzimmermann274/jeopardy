<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy — Host View</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<!-- ==========================================================
     Host View — a PRIVATE, read-only companion screen.
       Open host.html on the host's Mac or iPad (not the TV).
       It passively mirrors the game (question, answer, timer,
       winner-reveal heads-up, notes) and never affects the game.
       All logic lives in js/host.js; styles are self-contained here.
     ========================================================== -->
<style>
  :root {
    --bg: #0b1533;
    --bg2: #0a1128;
    --ink: #f3f6ff;
    --muted: #9fb0d8;
    --gold: #f4c542;
    --gold-deep: #d99e2b;
    --red: #ff5b5b;
    --green: #4bd684;
    --panel: rgba(255,255,255,0.055);
    --panel-border: rgba(255,255,255,0.14);
    --answer-ink: #17120a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1fa;
      --bg2: #e5e9f6;
      --ink: #131a3c;
      --muted: #5b678d;
      --gold: #c8901a;
      --gold-deep: #a9750d;
      --panel: rgba(15,25,70,0.05);
      --panel-border: rgba(15,25,70,0.16);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(244,197,66,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- top bar (mode tabs) ---- */
  #host-topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 50px; z-index: 60;
    display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 12px;
    background: rgba(8,14,36,.92); border-bottom: 1px solid var(--panel-border); backdrop-filter: blur(6px);
  }
  @media (prefers-color-scheme: light) { #host-topbar { background: rgba(234,238,248,.94); } }
  .hv-tabs { display: flex; gap: 8px; }
  .hv-tab {
    font: inherit; font-size: clamp(13px, 1.6vw, 16px); font-weight: 700;
    color: var(--muted); background: transparent; border: 1px solid var(--panel-border);
    border-radius: 999px; padding: 7px 16px; cursor: pointer;
  }
  .hv-tab.active { color: var(--answer-ink); background: linear-gradient(180deg, #f7cf5a, var(--gold-deep)); border-color: transparent; }

  /* ---- main content region (js writes into #host-content) ---- */
  #host-content {
    position: absolute;
    inset: 50px 0 0 0;          /* clear the fixed top bar */
    overflow-y: auto;
    display: flex;
    padding: 44px clamp(18px, 5vw, 64px) 156px;
    transition: opacity .3s ease, filter .3s ease;
  }
  /* When the corner timer is up, start the content below it so a long question
     never runs behind the numerals (the timer sits top-right). */
  body.timer-on #host-content { padding-top: clamp(165px, 20vh, 205px); }
  #host-content > * {           /* margin:auto centers AND allows scroll when tall */
    margin: auto;
    width: 100%;
    max-width: 1120px;
  }
  body.has-large-note #host-content { opacity: .12; filter: blur(1px); }

  /* preview mode: top-aligned, wider column, its own spacing */
  body.mode-preview #host-content { align-items: flex-start; padding: 22px clamp(14px, 3.5vw, 40px) 130px; }
  body.mode-preview #host-content > * { margin: 0 auto; max-width: 1320px; }

  /* ---- idle screens (setup / title / board) ---- */
  .idle { text-align: center; }
  .idle-title {
    font-size: clamp(30px, 5vw, 68px);
    font-weight: 800;
    letter-spacing: .01em;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .idle-sub {
    margin-top: 14px;
    font-size: clamp(16px, 2.2vw, 26px);
    color: var(--muted);
  }

  /* ---- question + answer ---- */
  .qa { width: 100%; }
  .qa-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 14px; }
  .qa-cat {
    font-size: clamp(15px, 1.9vw, 24px);
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .qa-tag {
    font-size: clamp(12px, 1.5vw, 16px);
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #1a1206;
    background: linear-gradient(180deg, #f7cf5a, var(--gold-deep));
    padding: 5px 12px;
    border-radius: 999px;
  }
  .qa-q {
    font-size: clamp(24px, 3.5vw, 54px);
    font-weight: 700;
    line-height: 1.24;
    margin: 4px 0 22px;
  }
  .qa-answer {
    /* Gold while it's still a secret (host-only)… */
    background: linear-gradient(180deg, #f7cf5a, #e7b02f);
    color: var(--answer-ink);
    border-radius: 16px;
    padding: clamp(14px, 2vw, 24px) clamp(16px, 2.4vw, 30px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    transition: background .35s ease;
  }
  /* …green once it's revealed on the TV, so the host can see it's no longer secret. */
  .qa-answer.revealed { background: linear-gradient(180deg, #5ed88a, #2fb463); }
  .a-label {
    font-size: clamp(12px, 1.4vw, 15px);
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    opacity: .72;
    margin-bottom: 4px;
  }
  .a-text {
    font-size: clamp(26px, 3.8vw, 60px);
    font-weight: 800;
    line-height: 1.15;
  }
  .a-text.muted {
    font-size: clamp(18px, 2.3vw, 30px);
    font-weight: 600;
    font-style: italic;
    opacity: .82;
  }
  .qa-status {
    margin-top: 16px;
    font-size: clamp(14px, 1.7vw, 20px);
    font-weight: 600;
  }
  .qa-status.on { color: var(--green); }
  .qa-status.off { color: var(--muted); }

  /* ---- Final Jeopardy: deliberately plain, at-a-glance ---- */
  .final-ready { width: 100%; text-align: center; }
  .fr-kicker { font-size: clamp(15px, 2.2vw, 26px); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .fr-title { font-size: clamp(44px, 9vw, 122px); font-weight: 900; line-height: 1.04; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  /* the wager-collecting stretch: a whole sentence, so a size down from "Ready for Final Jeopardy!" */
  .wager-prep .fr-title { font-size: clamp(32px, 5.6vw, 76px); }
  .fr-note { margin-top: clamp(16px, 3vh, 30px); font-size: clamp(16px, 2.1vw, 26px); line-height: 1.45;
             font-weight: 700; color: var(--muted); }
  .final-simple .fr-note { margin-top: clamp(14px, 2.4vh, 26px); font-weight: 600; }

  .final-simple { width: 100%; }
  .fs-banner {
    font-size: clamp(16px, 2.2vw, 26px); font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold); margin-bottom: clamp(16px, 3.5vh, 34px);
  }
  .fs-row { font-size: clamp(21px, 3vw, 42px); line-height: 1.3; margin-bottom: clamp(14px, 2.8vh, 30px); }
  .fs-row:last-child { margin-bottom: 0; }
  .fs-label { font-weight: 800; color: var(--muted); margin-right: .35em; }
  .fs-val { font-weight: 600; color: var(--ink); }
  .fs-answer { font-weight: 800; }
  .fs-answer.secret { color: var(--gold); }
  .fs-answer.revealed { color: var(--green); }
  .fs-answer.muted { color: var(--muted); font-style: italic; font-weight: 600; }

  /* ---- scores / winner ---- */
  .scores { text-align: center; width: 100%; }
  .scores-title, .winner-banner {
    font-size: clamp(18px, 2.4vw, 30px);
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
  }
  .winner-name { font-size: clamp(30px, 5vw, 64px); font-weight: 900; }
  .winner-score { font-size: clamp(22px, 3vw, 40px); font-weight: 800; color: var(--gold); margin: 4px 0 20px; }
  .scores-list { display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; }
  .score-row {
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 12px 20px;
    font-size: clamp(18px, 2.2vw, 28px);
  }
  .score-row.win { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .s-team { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; text-align: left; }
  .s-name { font-weight: 700; }
  .s-players { font-size: clamp(12px, 1.5vw, 17px); font-weight: 600; color: var(--muted); line-height: 1.2; }
  .s-score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .s-score.neg { color: var(--red); }

  /* ---- winner-reveal heads-up ---- */
  .headsup-wrap { text-align: center; width: 100%; }
  .hu-title {
    font-size: clamp(16px, 2.1vw, 26px); font-weight: 800; letter-spacing: .06em;
    color: var(--gold); margin-bottom: 18px;
  }
  .headsup {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 18px; padding: clamp(18px, 3vw, 34px);
    max-width: 820px; margin: 0 auto 22px;
  }
  .headsup.done { border-color: var(--gold); }
  .hu-kicker { font-size: clamp(14px, 1.8vw, 20px); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hu-place { margin-top: 8px; font-size: clamp(18px, 2.4vw, 30px); font-weight: 800; color: var(--gold); }
  .hu-name { margin-top: 6px; font-size: clamp(30px, 5.2vw, 68px); font-weight: 900; line-height: 1.05; }
  .hu-line { margin-top: 12px; font-size: clamp(16px, 2.1vw, 26px); color: var(--ink); }
  .hu-line b { font-variant-numeric: tabular-nums; }
  .hu-line b.up { color: var(--green); }
  .hu-line b.down { color: var(--red); }
  .hu-ref { display: flex; flex-direction: column; gap: 8px; max-width: 720px; margin: 0 auto; }
  .hu-ref-row {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 9px 16px; font-size: clamp(14px, 1.8vw, 20px); opacity: .55; text-align: left;
  }
  .hu-ref-row.shown { opacity: 1; }
  .hu-ref-row.next { opacity: 1; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .r-place { font-weight: 800; color: var(--gold); min-width: 2.6em; }
  .r-name { font-weight: 700; }
  .r-score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .r-state { font-size: .8em; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .hu-ref-row.next .r-state { color: var(--gold); font-weight: 800; }

  /* ---- 30-second timer (corner) ---- */
  .host-timer {
    position: fixed; top: clamp(56px, 8vh, 66px); right: clamp(12px, 2.6vw, 30px);
    /* above the phone-a-grandma card (110): the countdown must never be covered */
    z-index: 115; text-align: center; pointer-events: none;
    background: rgba(8,14,36,.9); border: 1px solid var(--panel-border);
    border-radius: 18px; padding: 8px 20px 10px; backdrop-filter: blur(6px);
  }
  @media (prefers-color-scheme: light) { .host-timer { background: rgba(234,238,248,.94); } }
  #host-timer-num {
    font-size: clamp(44px, 9vw, 108px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.28);
  }
  .host-timer-label { font-size: clamp(11px, 1.3vw, 15px); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .host-timer.low #host-timer-num { color: var(--red); animation: tpulse .5s ease-in-out infinite; }
  @keyframes tpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* ---- note from Danny ---- */
  .host-note { z-index: 50; }
  .note-label {
    font-size: clamp(12px, 1.5vw, 16px); font-weight: 800; letter-spacing: .16em;
    text-transform: uppercase; color: var(--gold-deep);
  }
  .note-text { color: var(--answer-ink); font-weight: 700; }

  .host-note.compact {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #f7cf5a, #e7b02f);
    border-top: 3px solid var(--gold-deep);
    padding: 12px clamp(16px, 4vw, 40px) 14px;
    max-height: 32vh; overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,.3);
  }
  .host-note.compact .note-label { color: rgba(23,18,10,.7); }
  .host-note.compact .note-text { font-size: clamp(18px, 2.4vw, 32px); line-height: 1.2; margin-top: 2px; }

  .host-note.large {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(90vw, 900px);
    background: linear-gradient(180deg, #f7cf5a, #e7b02f);
    border: 3px solid var(--gold-deep); border-radius: 22px;
    padding: clamp(24px, 4vw, 48px); text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }
  .host-note.large .note-label { color: rgba(23,18,10,.72); font-size: clamp(14px, 1.8vw, 20px); }
  .host-note.large .note-text { font-size: clamp(30px, 5vw, 66px); line-height: 1.15; margin-top: 10px; }

  .host-note.pop { animation: notepop .5s cubic-bezier(.2,.9,.25,1.15); }
  @keyframes notepop {
    0% { transform: translate(-50%, -50%) scale(.9); opacity: .3; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  /* the compact bar isn't centre-translated, so it pops from the bottom instead */
  .host-note.compact.pop { animation: notepopbar .45s cubic-bezier(.2,.9,.25,1.15); }
  @keyframes notepopbar {
    0% { transform: translateY(100%); opacity: .2; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* ---- "(team) has phoned grandma!" ----
     Above the note bar and the timer, below the category teleprompter. It lingers
     ~10s (js/host.js): the host is the one who has to react to it. */
  .host-phone {
    position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
    z-index: 110; width: min(92vw, 720px);
    /* the 30-second timer lives in the top-right corner; while it's counting, keep
       symmetric margins wide enough that this card never covers it */
    display: flex; align-items: center; gap: clamp(12px, 2.4vw, 24px);
    background: linear-gradient(180deg, #2f7d4f, #1d5a37);
    border: 3px solid #7ee0a6; border-radius: 20px;
    padding: clamp(14px, 2.4vw, 24px) clamp(18px, 3vw, 32px);
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  .hp-phone { font-size: clamp(34px, 6vw, 64px); line-height: 1; flex: none; }
  .hp-body { min-width: 0; }
  .hp-name {
    font-size: clamp(24px, 4vw, 46px); font-weight: 900; line-height: 1.05; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.3); word-break: break-word;
  }
  .hp-line { font-size: clamp(16px, 2.4vw, 28px); font-weight: 800; color: #cdf5dd; margin-top: 2px; }
  .hp-players { font-size: clamp(13px, 1.7vw, 19px); color: #a9dfc2; margin-top: 6px; }
  .hp-note { font-size: clamp(12px, 1.5vw, 17px); color: #8ecbaa; margin-top: 8px; font-style: italic; }
  body.timer-on .host-phone { max-width: calc(100vw - 2 * clamp(150px, 22vw, 210px)); }
  .host-phone.pop { animation: phonepop .45s cubic-bezier(.2,.9,.25,1.15); }
  @keyframes phonepop {
    0% { transform: translateX(-50%) translateY(-16px) scale(.94); opacity: 0; }
    100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
  }

  /* ---- Final Jeopardy wager entry (live mode) ---- */
  .fj-live { width: 100%; }
  .hv-wagers { margin-top: clamp(22px, 4vh, 42px); border-top: 1px solid var(--panel-border); padding-top: 20px; }
  .hv-wagers-title { font-size: clamp(17px, 2.3vw, 26px); font-weight: 800; color: var(--gold); }
  .hv-wagers-sub { font-size: clamp(13px, 1.6vw, 17px); color: var(--muted); margin: 4px 0 16px; }
  .hv-wager-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
  .hv-wager-name { font-size: clamp(17px, 2.2vw, 26px); font-weight: 700; }
  .hv-wager-score { color: var(--muted); font-weight: 600; font-size: .78em; }
  .hv-wager-input {
    font: inherit; font-size: clamp(18px, 2.4vw, 28px); font-weight: 800;
    width: clamp(120px, 30vw, 220px); text-align: right; padding: 10px 14px;
    border-radius: 10px; border: 2px solid var(--panel-border);
    background: var(--panel); color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .hv-wager-input:focus { outline: none; border-color: var(--gold); }

  /* ---- question preview mode ---- */
  .pv { width: 100%; }
  .pv-scores { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
  .pv-score { display: flex; align-items: baseline; gap: 10px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 7px 14px; }
  .pvs-name { font-weight: 700; font-size: clamp(14px, 1.8vw, 20px); }
  .pvs-val { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); font-size: clamp(15px, 1.9vw, 22px); }
  .pvs-val.neg { color: var(--red); }

  .pv-board { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .pv-col { flex: 1 1 0; min-width: 116px; display: flex; flex-direction: column; gap: 6px; }
  .pv-col-head {
    font-size: clamp(11px, 1.3vw, 15px); font-weight: 800; letter-spacing: .03em;
    text-transform: uppercase; color: var(--gold); text-align: center;
    min-height: 2.8em; display: flex; align-items: center; justify-content: center;
  }
  .pv-cell {
    font: inherit; font-size: clamp(15px, 1.8vw, 21px); font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--ink); background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 12px 6px; cursor: pointer; text-align: center;
  }
  .pv-cell.used { opacity: .48; }
  .pv-cell.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; color: var(--gold); }
  .pv-dd { font-size: .68em; color: var(--gold); }
  .pv-final { margin-top: 8px; width: 100%; letter-spacing: .04em; }
  .pv-empty { text-align: center; color: var(--muted); font-size: clamp(16px, 2.2vw, 24px); margin-top: 40px; }

  .pv-card { margin-top: 22px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; padding: clamp(16px, 3vw, 34px); }
  .pv-card-head { font-size: clamp(15px, 2vw, 24px); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
  .pv-q { font-size: clamp(22px, 3.2vw, 44px); font-weight: 700; line-height: 1.3; }
  .pv-imgs { display: flex; flex-wrap: wrap; gap: 14px; margin: 20px 0 4px; justify-content: center; }
  .pv-img { max-width: 100%; max-height: 48vh; border-radius: 10px; object-fit: contain; }
  .pv-a-row { margin-top: 18px; font-size: clamp(20px, 2.8vw, 34px); }
  .pv-a-label { font-weight: 800; color: var(--muted); margin-right: .35em; }
  .pv-a-text { font-weight: 800; color: var(--gold); }
  .pv-a-text.muted { color: var(--muted); font-style: italic; font-weight: 600; }

  /* ---- category-reveal takeover (synced to the TV's "Show categories") ---- */
  #host-catintro {
    position: fixed; inset: 0; z-index: 120;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(24px, 5vh, 64px) clamp(20px, 5vw, 72px);
    background:
      radial-gradient(120% 90% at 50% -12%, rgba(75,214,132,0.12), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2));
  }
  #host-catintro[hidden] { display: none; }        /* beat the id-selector's display:flex */
  .hv-ci-inner { width: 100%; max-width: 1040px; animation: ciFade .34s ease both; }
  @keyframes ciFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .hv-ci-kicker {
    text-align: center; font-size: clamp(14px, 2vw, 22px); font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    margin-bottom: clamp(18px, 4vh, 42px);
  }

  /* "Get ready" prompt — big and all-bold while the TV holds its title card */
  .ci-ready-wrap { text-align: center; }
  .hv-ci-ready {
    font-size: clamp(40px, 8.4vw, 118px); font-weight: 900; line-height: 1.04;
    letter-spacing: .01em; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.28);
  }

  /* the list + the sliding green rectangle */
