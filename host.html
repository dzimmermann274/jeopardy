<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy — Host View</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<!-- ==========================================================
     Host View — a PRIVATE, read-only companion screen.
       Open host.html on the host's Mac or iPad (not the TV).
       It passively mirrors the game (question, answer, timer,
       winner-reveal heads-up, notes) and never affects the game.
       All logic lives in js/host.js; styles are self-contained here.
     ========================================================== -->
<style>
  :root {
    --bg: #0b1533;
    --bg2: #0a1128;
    --ink: #f3f6ff;
    --muted: #9fb0d8;
    --gold: #f4c542;
    --gold-deep: #d99e2b;
    --red: #ff5b5b;
    --green: #4bd684;
    --panel: rgba(255,255,255,0.055);
    --panel-border: rgba(255,255,255,0.14);
    --answer-ink: #17120a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1fa;
      --bg2: #e5e9f6;
      --ink: #131a3c;
      --muted: #5b678d;
      --gold: #c8901a;
      --gold-deep: #a9750d;
      --panel: rgba(15,25,70,0.05);
      --panel-border: rgba(15,25,70,0.16);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(244,197,66,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- main content region (js writes into #host-content) ---- */
  #host-content {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    display: flex;
    padding: 92px clamp(18px, 5vw, 64px) 156px;
    transition: opacity .3s ease, filter .3s ease;
  }
  /* When the corner timer is up, start the content below it so a long question
     never runs behind the numerals (the timer sits top-right, up to ~200px tall). */
  body.timer-on #host-content { padding-top: clamp(150px, 22vh, 212px); }
  #host-content > * {           /* margin:auto centers AND allows scroll when tall */
    margin: auto;
    width: 100%;
    max-width: 1120px;
  }
  body.has-large-note #host-content { opacity: .12; filter: blur(1px); }

  /* ---- idle screens (setup / title / board) ---- */
  .idle { text-align: center; }
  .idle-title {
    font-size: clamp(30px, 5vw, 68px);
    font-weight: 800;
    letter-spacing: .01em;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .idle-sub {
    margin-top: 14px;
    font-size: clamp(16px, 2.2vw, 26px);
    color: var(--muted);
  }

  /* ---- question + answer ---- */
  .qa { width: 100%; }
  .qa-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 14px; }
  .qa-cat {
    font-size: clamp(15px, 1.9vw, 24px);
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .qa-tag {
    font-size: clamp(12px, 1.5vw, 16px);
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #1a1206;
    background: linear-gradient(180deg, #f7cf5a, var(--gold-deep));
    padding: 5px 12px;
    border-radius: 999px;
  }
  .qa-q {
    font-size: clamp(24px, 3.5vw, 54px);
    font-weight: 700;
    line-height: 1.24;
    margin: 4px 0 22px;
  }
  .qa-answer {
    /* Gold while it's still a secret (host-only)… */
    background: linear-gradient(180deg, #f7cf5a, #e7b02f);
    color: var(--answer-ink);
    border-radius: 16px;
    padding: clamp(14px, 2vw, 24px) clamp(16px, 2.4vw, 30px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    transition: background .35s ease;
  }
  /* …green once it's revealed on the TV, so the host can see it's no longer secret. */
  .qa-answer.revealed { background: linear-gradient(180deg, #5ed88a, #2fb463); }
  .a-label {
    font-size: clamp(12px, 1.4vw, 15px);
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    opacity: .72;
    margin-bottom: 4px;
  }
  .a-text {
    font-size: clamp(26px, 3.8vw, 60px);
    font-weight: 800;
    line-height: 1.15;
  }
  .a-text.muted {
    font-size: clamp(18px, 2.3vw, 30px);
    font-weight: 600;
    font-style: italic;
    opacity: .82;
  }
  .qa-status {
    margin-top: 16px;
    font-size: clamp(14px, 1.7vw, 20px);
    font-weight: 600;
  }
  .qa-status.on { color: var(--green); }
  .qa-status.off { color: var(--muted); }

  /* ---- Final Jeopardy: deliberately plain, at-a-glance ---- */
  .final-ready { width: 100%; text-align: center; }
  .fr-kicker { font-size: clamp(15px, 2.2vw, 26px); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .fr-title { font-size: clamp(44px, 9vw, 122px); font-weight: 900; line-height: 1.04; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.25); }

  .final-simple { width: 100%; }
  .fs-banner {
    font-size: clamp(16px, 2.2vw, 26px); font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold); margin-bottom: clamp(16px, 3.5vh, 34px);
  }
  .fs-row { font-size: clamp(21px, 3vw, 42px); line-height: 1.3; margin-bottom: clamp(14px, 2.8vh, 30px); }
  .fs-row:last-child { margin-bottom: 0; }
  .fs-label { font-weight: 800; color: var(--muted); margin-right: .35em; }
  .fs-val { font-weight: 600; color: var(--ink); }
  .fs-answer { font-weight: 800; }
  .fs-answer.secret { color: var(--gold); }
  .fs-answer.revealed { color: var(--green); }
  .fs-answer.muted { color: var(--muted); font-style: italic; font-weight: 600; }

  /* ---- scores / winner ---- */
  .scores { text-align: center; width: 100%; }
  .scores-title, .winner-banner {
    font-size: clamp(18px, 2.4vw, 30px);
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
  }
  .winner-name { font-size: clamp(30px, 5vw, 64px); font-weight: 900; }
  .winner-score { font-size: clamp(22px, 3vw, 40px); font-weight: 800; color: var(--gold); margin: 4px 0 20px; }
  .scores-list { display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; }
  .score-row {
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 12px 20px;
    font-size: clamp(18px, 2.2vw, 28px);
  }
  .score-row.win { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .s-name { font-weight: 700; }
  .s-score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .s-score.neg { color: var(--red); }

  /* ---- winner-reveal heads-up ---- */
  .headsup-wrap { text-align: center; width: 100%; }
  .hu-title {
    font-size: clamp(16px, 2.1vw, 26px); font-weight: 800; letter-spacing: .06em;
    color: var(--gold); margin-bottom: 18px;
  }
  .headsup {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 18px; padding: clamp(18px, 3vw, 34px);
    max-width: 820px; margin: 0 auto 22px;
  }
  .headsup.done { border-color: var(--gold); }
  .hu-kicker { font-size: clamp(14px, 1.8vw, 20px); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hu-place { margin-top: 8px; font-size: clamp(18px, 2.4vw, 30px); font-weight: 800; color: var(--gold); }
  .hu-name { margin-top: 6px; font-size: clamp(30px, 5.2vw, 68px); font-weight: 900; line-height: 1.05; }
  .hu-line { margin-top: 12px; font-size: clamp(16px, 2.1vw, 26px); color: var(--ink); }
  .hu-line b { font-variant-numeric: tabular-nums; }
  .hu-line b.up { color: var(--green); }
  .hu-line b.down { color: var(--red); }
  .hu-ref { display: flex; flex-direction: column; gap: 8px; max-width: 720px; margin: 0 auto; }
  .hu-ref-row {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 9px 16px; font-size: clamp(14px, 1.8vw, 20px); opacity: .55; text-align: left;
  }
  .hu-ref-row.shown { opacity: 1; }
  .hu-ref-row.next { opacity: 1; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .r-place { font-weight: 800; color: var(--gold); min-width: 2.6em; }
  .r-name { font-weight: 700; }
  .r-score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .r-state { font-size: .8em; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .hu-ref-row.next .r-state { color: var(--gold); font-weight: 800; }

  /* ---- 30-second timer (corner) ---- */
  .host-timer {
    position: fixed; top: clamp(10px, 2.4vw, 26px); right: clamp(12px, 2.6vw, 30px);
    z-index: 40; text-align: center; pointer-events: none;
    background: rgba(8,14,36,.9); border: 1px solid var(--panel-border);
    border-radius: 18px; padding: 8px 20px 10px; backdrop-filter: blur(6px);
  }
  #host-timer-num {
    font-size: clamp(48px, 11vw, 132px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.28);
  }
  .host-timer-label { font-size: clamp(11px, 1.3vw, 15px); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .host-timer.low #host-timer-num { color: var(--red); animation: tpulse .5s ease-in-out infinite; }
  @keyframes tpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* ---- note from Danny ---- */
  .host-note { z-index: 50; }
  .note-label {
    font-size: clamp(12px, 1.5vw, 16px); font-weight: 800; letter-spacing: .16em;
    text-transform: uppercase; color: var(--gold-deep);
  }
  .note-text { color: var(--answer-ink); font-weight: 700; }

  .host-note.compact {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #f7cf5a, #e7b02f);
    border-top: 3px solid var(--gold-deep);
    padding: 12px clamp(16px, 4vw, 40px) 14px;
    max-height: 32vh; overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,.3);
  }
  .host-note.compact .note-label { color: rgba(23,18,10,.7); }
  .host-note.compact .note-text { font-size: clamp(18px, 2.4vw, 32px); line-height: 1.2; margin-top: 2px; }

  .host-note.large {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(90vw, 900px);
    background: linear-gradient(180deg, #f7cf5a, #e7b02f);
    border: 3px solid var(--gold-deep); border-radius: 22px;
    padding: clamp(24px, 4vw, 48px); text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }
  .host-note.large .note-label { color: rgba(23,18,10,.72); font-size: clamp(14px, 1.8vw, 20px); }
  .host-note.large .note-text { font-size: clamp(30px, 5vw, 66px); line-height: 1.15; margin-top: 10px; }

  .host-note.pop { animation: notepop .5s cubic-bezier(.2,.9,.25,1.15); }
  @keyframes notepop {
    0% { transform: translate(-50%, -50%) scale(.9); opacity: .3; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  /* the compact bar isn't centre-translated, so it pops from the bottom instead */
  .host-note.compact.pop { animation: notepopbar .45s cubic-bezier(.2,.9,.25,1.15); }
  @keyframes notepopbar {
    0% { transform: translateY(100%); opacity: .2; }
    100% { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="host-timer" class="host-timer" hidden>
    <div id="host-timer-num">30</div>
    <div class="host-timer-label">seconds</div>
  </div>
  <div id="host-content"></div>
  <div id="host-note" class="host-note" hidden></div>
  <!-- bump ?v= on every deploy so browsers never run stale cached JS -->
  <script src="js/host.js?v=37"></script>
</body>
</html>
